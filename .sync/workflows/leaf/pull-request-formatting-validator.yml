#

name: Validate Pull Request Formatting

on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

jobs:
  validate_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (title.includes('Personal/')) {
              core.setFailed("Please add a meaningful PR title (remove the 'Personal/' prefix from the title).");
            }
            if (title === 'Repo File Sync: synced file(s) with microsoft/mu_devops') {
              core.setFailed('Please add a meaningful PR title (update the default file sync title).');
            }
